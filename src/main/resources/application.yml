server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never

spring:
  application:
    name: resource-booking-api
  datasource:
    url: jdbc:h2:mem:bookingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: false
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100

app:
  cors:
    # Comma-separated exact origins. Override with CORS_ALLOWED_ORIGINS in deployed environments.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  h2-console:
    enabled: false
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
