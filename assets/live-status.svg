<svg viewBox="0 0 1200 150" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Resource Booking API Live Status</title>
  <desc id="desc">Live service health and JWT authenticated state indicator.</desc>
  <style>
    :root {
      --panel: #f6f8fa;
      --ink: #0d1117;
      --muted: #57606a;
      --line: #d0d7de;
      --accent: #0969da;
      --good: #1a7f37;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --panel: #0d1117;
        --ink: #f0f6fc;
        --muted: #8b949e;
        --line: #30363d;
        --accent: #58a6ff;
        --good: #3fb950;
      }
    }
    .mono { font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace; }
    .trace { stroke-dasharray: 7 10; animation: move 2s linear infinite; }
    .status-ring { animation: status-ring 2.8s cubic-bezier(.2,.72,.2,1) infinite; }
    .draw { stroke-dasharray: 1100; animation: draw 1.5s cubic-bezier(.55,0,.2,1) backwards; }
    @keyframes move { to { stroke-dashoffset: -34; } }
    @keyframes status-ring {
      0% { r: 5px; opacity: .7; stroke-width: 2px; }
      72%, 100% { r: 15px; opacity: 0; stroke-width: 1px; }
    }
    @keyframes draw {
      from { stroke-dashoffset: 1100; }
      to { stroke-dashoffset: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .trace, .status-ring, .draw { animation: none; }
      .status-ring { opacity: .25; r: 10px; }
      .draw { stroke-dashoffset: 0; }
    }
  </style>

  <rect x="1" y="1" width="1198" height="148" rx="22" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/>
  <path class="draw" d="M38 34H1162" stroke="var(--line)"/>
  <circle class="status-ring" cx="70" cy="84" r="5" stroke="var(--good)" stroke-width="2"/>
  <circle cx="70" cy="84" r="5" fill="var(--good)"/>
  <text x="92" y="80" fill="var(--ink)" class="mono" font-size="13" font-weight="700" letter-spacing="2.2">SERVICE ACTIVE · RBAC ENFORCED</text>
  <text x="92" y="104" fill="var(--muted)" class="mono" font-size="11.5" letter-spacing="1.4">Spring Boot 3 · JPA Hibernate · MySQL / Postgres · Swagger OpenAPI 3</text>

  <path class="trace" d="M640 84C654 84 654 63 668 63C682 63 682 105 696 105C710 105 710 63 724 63C738 63 738 105 752 105C766 105 766 63 780 63C794 63 794 105 808 105C822 105 822 63 836 63C850 63 850 105 864 105C878 105 878 63 892 63C906 63 906 105 920 105C934 105 934 84 948 84H1118" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="1138" cy="84" r="5" fill="var(--accent)"/>
</svg>
