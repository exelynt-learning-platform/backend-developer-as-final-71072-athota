<svg viewBox="0 0 1200 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Resource Booking API Signal Flow &amp; Architecture</title>
  <desc id="desc">Layered architecture diagram from client HTTP requests to JWT security filter, controllers, service business logic, and JPA repositories.</desc>
  <style>
    :root {
      --panel: #f6f8fa;
      --card: #ffffff;
      --ink: #0d1117;
      --muted: #57606a;
      --line: #d0d7de;
      --accent: #0969da;
      --accent-soft: #ddf4ff;
      --good: #1a7f37;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --panel: #0d1117;
        --card: #161b22;
        --ink: #f0f6fc;
        --muted: #8b949e;
        --line: #30363d;
        --accent: #58a6ff;
        --accent-soft: #0c2d4a;
        --good: #3fb950;
      }
    }
    .sans { font-family: Geist, "Avenir Next", "Segoe UI", system-ui, sans-serif; }
    .mono { font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace; }
    .flow { stroke-dasharray: 8 12; animation: flow 1.8s linear infinite; }
    .pulse-ring { animation: pulse-ring 2.8s cubic-bezier(.2,.72,.2,1) infinite; }
    .rise { animation: rise .7s cubic-bezier(.2,.7,.2,1) backwards; }
    .n1 { animation-delay: .12s; }
    .n2 { animation-delay: .3s; }
    .n3 { animation-delay: .48s; }
    .n4 { animation-delay: .7s; }
    @keyframes flow { to { stroke-dashoffset: -40; } }
    @keyframes pulse-ring {
      0% { r: 8px; opacity: .65; stroke-width: 2px; }
      72%, 100% { r: 18px; opacity: 0; stroke-width: 1px; }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .flow, .pulse-ring, .rise { animation: none; }
      .pulse-ring { opacity: .2; r: 13px; }
    }
  </style>

  <rect x="1" y="1" width="1198" height="458" rx="24" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/>
  <text x="54" y="54" fill="var(--muted)" class="mono" font-size="13" letter-spacing="2.4">RESOURCE BOOKING PIPELINE · JWT &amp; RBAC FLOW</text>
  <text x="1146" y="54" text-anchor="end" fill="var(--muted)" class="mono" font-size="13">FIG. 01</text>

  <!-- Connectors -->
  <path d="M260 194H340" stroke="var(--line)" stroke-width="3"/>
  <path class="flow" d="M260 194H340" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
  <path d="M540 194H620" stroke="var(--line)" stroke-width="3"/>
  <path class="flow" d="M540 194H620" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
  <path d="M820 194H900" stroke="var(--line)" stroke-width="3"/>
  <path class="flow" d="M820 194H900" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>

  <!-- Card 1: Auth & Request -->
  <g class="rise n1">
    <rect x="52" y="92" width="208" height="230" rx="18" fill="var(--card)" stroke="var(--line)"/>
    <rect x="72" y="116" width="64" height="26" rx="13" fill="var(--accent-soft)"/>
    <text x="104" y="133" text-anchor="middle" fill="var(--accent)" class="mono" font-size="11" font-weight="700">CLIENT</text>
    <text x="72" y="176" fill="var(--ink)" class="sans" font-size="20" font-weight="700">HTTP &amp; JWT</text>
    <text x="72" y="206" fill="var(--muted)" class="mono" font-size="12">POST /auth/login</text>
    <text x="72" y="228" fill="var(--muted)" class="mono" font-size="12">Bearer JWT Header</text>
    <text x="72" y="250" fill="var(--muted)" class="mono" font-size="12">Role: USER / ADMIN</text>
  </g>

  <!-- Card 2: Security Filter -->
  <g class="rise n2">
    <rect x="340" y="92" width="200" height="230" rx="18" fill="var(--card)" stroke="var(--line)"/>
    <rect x="360" y="116" width="70" height="26" rx="13" fill="var(--accent-soft)"/>
    <text x="395" y="133" text-anchor="middle" fill="var(--accent)" class="mono" font-size="11" font-weight="700">FILTER</text>
    <text x="360" y="176" fill="var(--ink)" class="sans" font-size="20" font-weight="700">JwtAuthFilter</text>
    <text x="360" y="206" fill="var(--muted)" class="mono" font-size="12">Validates Token</text>
    <text x="360" y="228" fill="var(--muted)" class="mono" font-size="12">Extracts Principal</text>
    <text x="360" y="250" fill="var(--muted)" class="mono" font-size="12">SecurityContext</text>
  </g>

  <!-- Card 3: RBAC Controller & Service -->
  <g class="rise n3">
    <rect x="620" y="92" width="200" height="230" rx="18" fill="var(--card)" stroke="var(--line)"/>
    <rect x="640" y="116" width="72" height="26" rx="13" fill="var(--accent-soft)"/>
    <text x="676" y="133" text-anchor="middle" fill="var(--accent)" class="mono" font-size="11" font-weight="700">SERVICE</text>
    <text x="640" y="176" fill="var(--ink)" class="sans" font-size="20" font-weight="700">RBAC Engine</text>
    <text x="640" y="206" fill="var(--muted)" class="mono" font-size="12">Conflict Check</text>
    <text x="640" y="228" fill="var(--muted)" class="mono" font-size="12">Decimal Pricing</text>
    <text x="640" y="250" fill="var(--muted)" class="mono" font-size="12">User Identity Lock</text>
  </g>

  <!-- Card 4: Database Layer -->
  <g class="rise n4">
    <rect x="900" y="92" width="248" height="230" rx="18" fill="var(--card)" stroke="var(--line)"/>
    <rect x="920" y="116" width="72" height="26" rx="13" fill="var(--accent-soft)"/>
    <text x="956" y="133" text-anchor="middle" fill="var(--accent)" class="mono" font-size="11" font-weight="700">STORAGE</text>
    <text x="920" y="176" fill="var(--ink)" class="sans" font-size="20" font-weight="700">JPA Hibernate</text>
    <text x="920" y="206" fill="var(--muted)" class="mono" font-size="12">MySQL / PostgreSQL</text>
    <text x="920" y="228" fill="var(--muted)" class="mono" font-size="12">Pagination &amp; Sort</text>
    <circle cx="940" cy="275" r="8" fill="var(--good)"/>
    <circle class="pulse-ring" cx="940" cy="275" r="8" stroke="var(--good)" stroke-width="2"/>
    <text x="960" y="280" fill="var(--good)" class="mono" font-size="12" font-weight="700">PERSISTED</text>
  </g>

  <g>
    <rect x="52" y="356" width="1096" height="54" rx="14" fill="var(--card)" stroke="var(--line)"/>
    <text x="76" y="388" fill="var(--muted)" class="mono" font-size="12.5">SECURITY GUARANTEE:</text>
    <text x="245" y="388" fill="var(--ink)" class="mono" font-size="12.5">USER identity strictly derived from JWT claims — never spoofable via request body payloads.</text>
  </g>
</svg>
